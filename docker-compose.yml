services:
  api:
    build: .
    container_name: driveseed-api
    restart: unless-stopped
    init: true          # reap zombie chromium processes
    ipc: host           # chromium needs more shared memory than the default
    env_file: .env
    environment:
      - PORT=8000
      - DATA_DIR=/data
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/data    # state.json / meta.json live here (survives rebuilds)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
